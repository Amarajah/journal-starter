apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      containers:
        - name: journal-api
          image: journal-api
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: journal-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: journal-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://adot-collector:4317
          readinessProbe:
            httpGet:
              path: /version
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /version
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
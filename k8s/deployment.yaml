apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      containers:
        - name: journal-api
          image: ghcr.io/amarajah/journal-starter:05a949aedca6467fc9b00ef970500605ed56aed9
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
              httpGet:
                path: /docs
                port: 8000
              initialDelaySeconds: 5
              periodSeconds: 5
          envFrom:
            - secretRef:
                name: journal-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: journal-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://adot-collector:4317
apiVersion: v1
kind: ConfigMap
metadata:
  name: adot-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: basic
      awsxray:
        region: eu-north-1
      awsemf:
        region: eu-north-1
        namespace: JournalAPI
        log_group_name: /journal-api/metrics
        resource_to_telemetry_conversion:
          enabled: true
      awscloudwatchlogs:
        region: eu-north-1
        log_group_name: /journal-api/app-logs
        log_stream_name: journal-api
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [awsxray]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [awsemf]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [awscloudwatchlogs]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adot-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adot-collector
  template:
    metadata:
      labels:
        app: adot-collector
    spec:
      serviceAccountName: adot-collector
      containers:
        - name: adot
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.50.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: conf
              mountPath: /conf
      volumes:
        - name: conf
          configMap:
            name: adot-config
---
apiVersion: v1
kind: Service
metadata:
  name: adot-collector
spec:
  selector:
    app: adot-collector
  ports:
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318